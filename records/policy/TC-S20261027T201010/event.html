:root{--bg:#07080a;--panel:#101215;--ink:#eef0f2;--mut:#8b9096;--line:#262a30;--red:#ff4d4f;--green:#3ddc84;
--amber:#ffb020;--violet:#b48cff;--teal:#2ec4b6;--orange:#ff8a3d;--blue:#4da3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",
Helvetica,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:24px;margin:6px 0 4px}h2{font-size:17px;margin:0 0 10px;color:var(--ink)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.stmt{display:inline-block;border-left:8px solid var(--amber);background:rgba(8,9,11,.8);padding:8px 14px;
border-radius:8px;font-weight:600}
dl.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;margin:14px 0 0}
dl.facts div{border-top:1px solid var(--line);padding-top:6px}dt{color:var(--mut);font-size:12px}dd{margin:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{position:relative;background:#0c0e11;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.t-name{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.t-val{font-size:28px;font-weight:700;margin:2px 0}.t-sub{color:var(--mut);font-size:12px}
.method{display:none;margin-top:8px;color:var(--mut);font-size:11.5px;border-top:1px dashed var(--line);padding-top:6px}
.tile:hover .method{display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.ns{color:var(--amber);font-size:13px;font-weight:600}
table{border-collapse:collapse;width:100%}th,td{text-align:left;vertical-align:top;padding:7px 8px;
border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:12px}
.legend{color:var(--mut);font-size:12px;margin-top:6px}.legend span{margin-right:14px;white-space:nowrap}
svg text{fill:var(--mut);font-size:11px}a{color:var(--blue)}
pre{background:#0c0e11;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px}
@media (max-width:640px){main{padding:14px 12px}.t-val{font-size:24px}}
@media print{body{background:#fff;color:#000}section,.tile{background:#fff;border-color:#bbb}.method{display:block}
svg text{fill:#333}.stmt{background:#fff}}

.wrap{display:grid;grid-template-columns:260px 1fr;gap:14px}@media (max-width:820px){.wrap{grid-template-columns:1fr}}

.li{display:block;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:12.5px}
.li.on,.li:hover{background:#1b1f25}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.mut{color:var(--mut)}#badge{border-left:10px solid #8b9096;background:rgba(8,9,11,.84);padding:10px 16px;

#rows tr.at td{background:#1d2a3a}#rows tr.this td{color:var(--amber)}#rows td{font-size:12px;padding:3px 6px}

  $('badge').style.borderLeftColor = COLS[e.type] || '#8b9096';
  $('btitle').textContent = `${e.type.replace('_', ' ').toUpperCase()} · ${e.subtype}`;
  $('bsub').textContent = e.detail;
  const lab = e.label ? `<b style="color:${lc}">${esc(e.label.label)}</b> · ${esc(e.label.review === 'one_by_one' ? 'the operator, one by one' : e.label.review === 'bulk' ? 'bulk: a proposal accepted without looking' : 'a model panel')}` +
    (e.label.note ? ` · note: “${esc(e.label.note)}”` : '') + ` · label row #${e.label.seq} <span class="mono">${esc(e.label.row_sha256.slice(0, 16))}</span>` : 'unreviewed (no label)';
  $('facts').innerHTML = `<div><dt>Session</dt><dd>${esc(e.session)} · ${esc(e.wall_iso)} · ${e.rel_s == null ? '-' : '+' + e.rel_s.toFixed(1) + ' s into the loop'}</dd></div>` +
    `<div><dt>Label</dt><dd>${lab}</dd></div>` +
    (e.latency_ms != null ? `<div><dt>Frame to hold</dt><dd>${e.latency_ms} ms</dd></div>` : '') +
    (e.judge ? `<div><dt>Judge #${e.judge.seq} (${esc(e.judge.phase)})</dt><dd>${esc(e.judge.recommend)}, p_unsafe ${esc(e.judge.p_unsafe)}, ${esc(e.judge.latency_s)} s, ${e.judge.unsafe_by_code ? 'UNSAFE' : 'not UNSAFE'} by the code; its words: “${esc(e.judge.reason)}”</dd></div>` : '') +
    `<div><dt>Chain (V1 row #${e.chain.seq})</dt><dd class="mono">before ${esc(e.chain.prev_sha256)}<br>this ${esc(e.chain.row_sha256)}<br>after ${esc(e.chain.next_sha256)}</dd></div>`;
  $('mnote').textContent = e.media.note;
  $('lanes').innerHTML = e.steps.length ? lanes(e) : '<p class="mut">No step rows within 3 s (the event precedes the control loop).</p>';
  $('rows').innerHTML = e.steps.map(s => ({dt: s.dt, html: `<tr data-dt="${s.dt}"><td>${s.dt >= 0 ? '+' : ''}${s.dt.toFixed(2)}</td><td>${esc(s.phase)}</td><td>${s.cmd ? 'sent' : '-'}</td><td>${s.fired.length ? 'm' + s.fired.join(',m') : '-'}</td><td>${s.n_hands == null ? '-' : s.n_hands}</td><td class="mono">${s.palms ? esc(JSON.stringify(s.palms)) : '-'}</td></tr>`}))
    .concat(e.rows.map(r => ({dt: r.dt, html: `<tr data-dt="${r.dt}" class="${r.this ? 'this' : 'other'}"><td>${r.dt >= 0 ? '+' : ''}${r.dt.toFixed(2)}</td><td colspan="5">${esc(r.text)}</td></tr>`})))
    .sort((a, b) => a.dt - b.dt).map(r => r.html).join('');
  $('scrub').value = 0; scrub(0);
}
function scrub(v){
  if (!cur) return; v = Number(v); $('tval').textContent = (v >= 0 ? '+' : '') + v.toFixed(2) + ' s';
  const c = $('cursor'); if (c) { const x = 70 + 560 * (v + 3) / 6; c.setAttribute('x1', x); c.setAttribute('x2', x); }
  const fr = cur.media.frames; let f = fr[0];
  if (cur.media.kind === 'clip' && fr.length) f = fr.reduce((a, b) => Math.abs(b.dt - v) < Math.abs(a.dt - v) ? b : a);
  $('img').innerHTML = f ? `<img alt="${esc(f.caption)}" src="${f.src}"><div class="mut">${esc(f.caption)}${fr.length > 1 && cur.media.kind !== 'clip' ? ' · ' + (fr.length - 1) + ' more below' : ''}</div>` + (cur.media.kind !== 'clip' ? fr.slice(1).map(g => `<img alt="${esc(g.caption)}" src="${g.src}"><div class="mut">${esc(g.caption)}</div>`).join('') : '') : '<p class="mut">Frames are not published in this repository. Where a frame was stored, its sha256 is in the logs.</p>';
  let best = null; document.querySelectorAll('#rows tr').forEach(tr => { tr.classList.remove('at'); if (best === null || Math.abs(tr.dataset.dt - v) < Math.abs(best.dataset.dt - v)) best = tr; });
  if (best) best.classList.add('at');
}
$('scrub').addEventListener('input', ev => scrub(ev.target.value));
document.addEventListener('keydown', ev => { if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { const s = $('scrub'); s.value = Math.max(-3, Math.min(3, Number(s.value) + (ev.key === 'ArrowRight' ? 1 : -1) / 15)); scrub(s.value); } });
